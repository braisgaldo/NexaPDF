name: Release

# Publica una version: compila el AAB y el APK firmados, genera la
# documentacion en HTML, PDF y DOCX, y lo adjunta todo a la Release.
#
# La clave de firma NO esta en el repositorio: llega por secrets. Para
# configurarlos, ver docs/INSTALL.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      etiqueta:
        description: 'Etiqueta a publicar (por ejemplo v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  publicar:
    name: Compilar y publicar
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Pandoc para la documentacion
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc wkhtmltopdf

      - name: Restaurar el keystore desde los secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.NEXAPDF_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret NEXAPDF_KEYSTORE_BASE64."
            exit 1
          fi
          mkdir -p docs/google_play/claves
          echo "$KEYSTORE_BASE64" | base64 -d > docs/google_play/claves/nexapdf-release.p12

      - name: Pruebas unitarias
        run: ./gradlew :composeApp:desktopTest --no-daemon

      - name: Compilar el AAB y el APK firmados
        env:
          NEXAPDF_STORE_FILE: docs/google_play/claves/nexapdf-release.p12
          NEXAPDF_STORE_PASSWORD: ${{ secrets.NEXAPDF_STORE_PASSWORD }}
          NEXAPDF_KEY_ALIAS: ${{ secrets.NEXAPDF_KEY_ALIAS }}
          NEXAPDF_KEY_PASSWORD: ${{ secrets.NEXAPDF_KEY_PASSWORD }}
        run: ./gradlew :composeApp:bundleRelease :composeApp:assembleRelease --no-daemon

      - name: Comprobar que el resultado esta firmado
        run: |
          AAB=composeApp/build/outputs/bundle/release/composeApp-release.aab
          if ! jarsigner -verify "$AAB" | grep -q "jar verified"; then
            echo "::error::El AAB no esta firmado."
            exit 1
          fi
          echo "AAB firmado correctamente."

      - name: Generar la documentacion
        run: ./docs/build-docs.sh

      - name: Borrar el keystore del disco
        if: always()
        run: rm -f docs/google_play/claves/nexapdf-release.p12

      - name: Crear la Release con sus adjuntos
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.etiqueta || github.ref_name }}
          name: NexaPDF ${{ github.event.inputs.etiqueta || github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          files: |
            composeApp/build/outputs/bundle/release/composeApp-release.aab
            composeApp/build/outputs/apk/release/composeApp-release.apk
            docs/out/*.pdf
            docs/out/*.docx
            docs/out/*.html
