org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.parallel=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072m

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# Compose Multiplatform: recursos compartidos y previsualizaciones
org.jetbrains.compose.experimental.uikit.enabled=true

# AGP 9 dejo de admitir 'com.android.application' junto al plugin de Kotlin
# Multiplatform en el mismo modulo. Estas dos propiedades restauran el
# comportamiento de AGP 8 (Kotlin lo gestiona el plugin de KMP y se usa el DSL
# clasico), que es la ruta que documenta el propio AGP mientras el nuevo plugin
# de aplicacion multiplataforma no exista. Ver docs/adr/0001-stack.md
android.builtInKotlin=false
android.newDsl=false
